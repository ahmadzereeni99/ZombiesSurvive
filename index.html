<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neon Horde</title>
<style>
:root{--bg:#0b0b16;--fg:#e8e8ff;--accent:#7cf5ff;--card:#171730;--line:#34346a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;touch-action:none;user-select:none}
canvas{display:block;width:100%;height:100%}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(5,5,15,.78);text-align:center;padding:16px}
#ov.hide{display:none}
h1{margin:0;font-size:clamp(28px,7vw,52px);color:var(--accent);letter-spacing:2px;text-shadow:0 0 18px var(--accent)}
p{margin:0;opacity:.8;max-width:420px;line-height:1.4}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
button{background:var(--card);color:var(--fg);border:2px solid var(--line);border-radius:12px;padding:12px 16px;font-size:16px;cursor:pointer;min-width:150px}
button:hover{border-color:var(--accent)}
button b{display:block;color:var(--accent);margin-bottom:4px}
button small{opacity:.75}
#mt{position:absolute;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:5;min-width:0;padding:6px 10px;font-size:18px;opacity:.75}
.go{background:var(--accent);color:#06101a;border-color:var(--accent);font-weight:700;font-size:18px}
</style>
</head>

// ===== PLAYER SPRITE =====
// To use your own art: set SHEET.src to an image path (e.g. 'assets/runner.png').
// The sheet is ONE ROW of equal-size frames, character facing RIGHT. Frame 0 = standing.
const SHEET={src:null,frames:6,size:44,fps:12};
const SIMG=new Image();if(SHEET.src)SIMG.src=SHEET.src;
function drawGuy(ph,moving){
if(SHEET.src&&SIMG.complete&&SIMG.naturalWidth){
const fw=SIMG.naturalWidth/SHEET.frames,fh=SIMG.naturalHeight,f=moving?1+Math.floor(ph/6.283*(SHEET.frames-1))%(SHEET.frames-1):0,sz=SHEET.size,sh=sz*fh/fw;
ctx.drawImage(SIMG,f*fw,0,fw,fh,-sz/2,-sh/2,sz,sh);return}
const sw=moving?Math.sin(ph):0,bob=moving?1+.05*Math.abs(Math.sin(ph)):1;
// boots (alternate forward/back)
ctx.fillStyle='#22223d';
for(const t of[-1,1]){ctx.beginPath();ctx.ellipse(-3+t*sw*8,t*5,5.5,3.4,0,0,6.283);ctx.fill()}
ctx.save();ctx.scale(bob,bob);
// gun
ctx.fillStyle='#4a4a66';ctx.fillRect(8,-2,15,4);ctx.fillStyle='#7cf5ff';ctx.fillRect(21,-2,3,4);
// arms (swing opposite to legs)
ctx.strokeStyle='#1f9fc0';ctx.lineWidth=4;ctx.lineCap='round';
for(const t of[-1,1]){ctx.beginPath();ctx.moveTo(0,t*8);ctx.lineTo(9-t*sw*2,t*3.2);ctx.stroke()}
ctx.fillStyle='#f2c9a0';for(const t of[-1,1]){ctx.beginPath();ctx.arc(10-t*sw*2,t*3,2.4,0,6.283);ctx.fill()}
// torso
ctx.shadowColor='#7cf5ff';ctx.shadowBlur=12;ctx.fillStyle='#2bb8d6';ctx.beginPath();ctx.ellipse(-1,0,6.5,10.5,0,0,6.283);ctx.fill();ctx.shadowBlur=0;
ctx.fillStyle='#e8fdff';ctx.fillRect(-5,-1,3,2);
// head
ctx.fillStyle='#f2c9a0';for(const t of[-1,1]){ctx.beginPath();ctx.arc(0,t*6.3,1.8,0,6.283);ctx.fill()}
ctx.fillStyle='#3a2a5a';ctx.beginPath();ctx.arc(0,0,6.6,0,6.283);ctx.fill();
ctx.fillStyle='#ff4f7b';ctx.fillRect(1.5,-6,2.2,12);
ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(4.5,0,1.6,0,6.283);ctx.fill();
ctx.restore()}

let AC=null,MG=null,NB=null,muted=false,sfxT={},gemC=0,gemLast=0;
try{muted=localStorage.getItem('nh_mute')==='1'}catch(e){}
function au(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=.55;MG.connect(AC.destination);
NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}catch(e){AC=null}}
if(AC&&AC.state==='suspended')AC.resume()}
function tone(f1,f2,d,type,vol,dl){if(!AC)return;const t=AC.currentTime+(dl||0),o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);
if(f2!==f1)o.frequency.exponentialRampToValueAtTime(Math.max(1,f2),t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);
o.connect(g);g.connect(MG);o.start(t);o.stop(t+d+.02)}
function noise(d,vol,fq,type,dl){if(!AC)return;const t=AC.currentTime+(dl||0),s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NB;f.type=type||'lowpass';f.frequency.value=fq;
g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(MG);s.start(t,Math.random()*.5);s.stop(t+d+.02)}
function puff(d,vol,f1,f2,dl){if(!AC)return;const t=AC.currentTime+(dl||0),s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NB;f.type='bandpass';f.Q.value=.8;
f.frequency.setValueAtTime(f1,t);f.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+d*.25);g.gain.exponentialRampToValueAtTime(.0001,t+d);
s.connect(f);f.connect(g);g.connect(MG);s.start(t,Math.random()*.5);s.stop(t+d+.02)}
const GAP={shoot:.05,step:.08,die:.04,gem:.025,lvl:.3};
function sfx(n){if(muted||!AC)return;const now=performance.now();if(now-(sfxT[n]||0)<GAP[n]*1000)return;sfxT[n]=now;
if(n==='shoot'){tone(950,180,.09,'square',.06);noise(.05,.12,3500,'highpass')}
else if(n==='step'){const k=R(.9,1.1);tone(150*k,55,.09,'sine',.45);noise(.05,.22,600,'lowpass')}
else if(n==='die'){
tone(R(110,140),R(190,230),.22,'sine',.28);puff(.3,.14,350,1800);
const nb=5+Math.floor(Math.random()*3);
for(let i=0;i<nb;i++){const f=R(260,620),dl=R(0,.14),du=R(.07,.13);
const t=AC.currentTime+dl,o=AC.createOscillator(),g=AC.createGain(),l=AC.createOscillator(),lg=AC.createGain();
o.type='sine';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*R(1.8,2.8),t+du*.7);
l.frequency.value=R(28,45);lg.gain.value=f*.04;l.connect(lg);lg.connect(o.frequency);
g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(R(.12,.2),t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+du);
o.connect(g);g.connect(MG);o.start(t);l.start(t);o.stop(t+du+.02);l.stop(t+du+.02)}
tone(R(1200,1700),500,.06,'sine',.08,.18);puff(.15,.06,3000,1000,.15)}
else if(n==='gem'){const t=now/1000;gemC=t-gemLast<.3?Math.min(gemC+1,6):0;gemLast=t;const f=1450*Math.pow(2,gemC/12)*R(.985,1.015);
noise(.025,.12,7500,'highpass');
tone(f,f,.3,'sine',.13);tone(f*2.76,f*2.76,.2,'sine',.09);tone(f*5.4,f*5.4,.1,'sine',.05);
tone(f*1.5,f*1.5,.34,'sine',.12,.07);tone(f*1.5*2.76,f*1.5*2.76,.22,'sine',.08,.07);tone(f*1.5*5.4,f*1.5*5.4,.1,'sine',.04,.07)}
else if(n==='lvl'){[523,659,784,1047,1319].forEach((f,i)=>tone(f,f,.22,'triangle',.22,i*.09));tone(2093,2093,.4,'sine',.1,.45);noise(.35,.06,6000,'highpass',.4)}}

const SHC=(()=>{const c=document.createElement('canvas');c.width=64;c.height=32;const x=c.getContext('2d');x.scale(1,.5);
const g=x.createRadialGradient(32,32,2,32,32,31);g.addColorStop(0,'rgba(0,0,0,.6)');g.addColorStop(.6,'rgba(0,0,0,.32)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,64,64);return c})();
function shadow(x,y,w,a){ctx.globalAlpha=a;ctx.drawImage(SHC,x-w/2,y-w/4,w,w/2);ctx.globalAlpha=1}
// ===== SIDEWALK TEXTURE (procedural, seamless) =====
let PAT=null;
function makeSidewalk(k){const TS=512,SL=256,c=document.createElement('canvas');c.width=c.height=TS*k;const x=c.getContext('2d');x.scale(k,k);
const rnd=(a,b)=>a+Math.random()*(b-a);
const wrap=f=>{for(const ox of[-TS,0,TS])for(const oy of[-TS,0,TS]){x.save();x.translate(ox,oy);f();x.restore()}};
x.fillStyle='#c4c2ba';x.fillRect(0,0,TS,TS);
// each slab gets its own tone
for(let i=0;i<2;i++)for(let j=0;j<2;j++){const v=rnd(-.09,.09);x.fillStyle=v>0?`rgba(255,248,235,${v})`:`rgba(25,25,35,${-v*1.4})`;x.fillRect(i*SL,j*SL,SL,SL)}
// large mottled blotches
for(let n=0;n<50;n++){const bx=rnd(0,TS),by=rnd(0,TS),r=rnd(25,100),dark=Math.random()<.55,al=rnd(.05,.12),col=dark?'95,92,88':'250,247,238';

function start(){
P={x:0,y:0,hp:100,max:100,spd:150,xp:0,lvl:1,next:10,inv:0,face:0};
S={dmg:1,rate:1,count:1,orbit:0,nova:0,mag:70,ang:0,ncd:3};
E=[];B=[];G=[];FX=[];DY=[];T=0;K=0;cd=0;nv=0;shake=0;state='play';ov.className='hide'}

function menu(){state='menu';ov.className='';ov.innerHTML=`<h1>NEON HORDE</h1><p>Survive the swarm. Your bolts fire automatically — just move. Collect gold coins, level up, build your loadout.</p><p>WASD / arrows, or drag on touch screens.</p><p>Best: ${best.toFixed(0)}s</p><button class="go" id="go">Play</button>`;document.getElementById('go').onclick=start}
function over(){state='over';let t=T;if(t>best){best=t;try{localStorage.setItem('nh_best',best)}catch(e){}}
ov.className='';ov.innerHTML=`<h1>YOU FELL</h1><p>Survived ${t.toFixed(0)}s · ${K} defeated · level ${P.lvl}</p><p>Best: ${best.toFixed(0)}s</p><button class="go" id="go">Try again</button>`;document.getElementById('go').onclick=start}
function levelUp(){state='pick';sfx('lvl');P.lvl++;P.xp-=P.next;P.next=Math.round(P.next*1.4+6);
const c=[...UPS].sort(()=>Math.random()-.5).slice(0,3);
ov.className='';ov.innerHTML='<h1 style="font-size:32px">LEVEL UP</h1><div class="row" id="rw"></div>';
c.forEach(u=>{const b=document.createElement('button');b.innerHTML=`<b>${u.n}</b><small>${u.d}</small>`;b.onclick=()=>{u.f();ov.className='hide';state='play'};document.getElementById('rw').appendChild(b)})}

function spawn(){
const a=R(0,6.283),d=Math.hypot(W,H)/2+40;
const r=Math.random(),k=T<25?0:r<.12&&T>45?2:r<.4&&T>15?1:0;
const sc=1+T/90;
const t=[{r:11,hp:3,s:55,c:'#ff4f7b',dmg:8,xp:1},{r:8,hp:2,s:95,c:'#ffb347',dmg:6,xp:1},{r:20,hp:16,s:38,c:'#b36bff',dmg:14,xp:4}][k];
E.push({x:P.x+Math.cos(a)*d,y:P.y+Math.sin(a)*d,r:t.r,hp:t.hp*sc,s:t.s*(1+T/400),c:t.c,dmg:t.dmg,xp:t.xp,k,hit:0,fl:0,ph:R(0,6.283),flip:1})}

function hurt(e,d){e.hp-=d;e.fl=.08;
if(e.hp<=0&&!e.dead){e.dead=1;K++;sfx('die');G.push({x:e.x,y:e.y,v:e.xp});{const dx=e.x-P.x,dy=e.y-P.y,l=Math.hypot(dx,dy)||1;DY.push({x:e.x,y:e.y,r:e.r,k:e.k,ph:e.ph,flip:e.flip,t:0,vx:dx/l*70,vy:dy/l*70,rot:(Math.random()<.5?-1:1)*R(1.5,3)})}
for(let i=0;i<(ZS?12:6);i++)FX.push({x:e.x,y:e.y,vx:R(-120,120),vy:R(-120,120),l:ZS?.55:.4,c:ZS?(i%3?'#9be34a':'#c8ff6b'):e.c})}}

function update(dt){
T+=dt;
let mx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),my=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
if(joy){mx=joy.dx;my=joy.dy}
const ml=Math.hypot(mx,my);if(ml>1){mx/=ml;my/=ml}
P.x+=mx*P.spd*dt;P.y+=my*P.spd*dt;if(ml>.1){P.face=Math.atan2(my,mx);P.run=(P.run||0)+dt*P.spd*.075*Math.min(1,ml);P.moving=1;{const st=Math.floor((P.run+1.5708)/Math.PI);if(st!==P.st){P.st=st;sfx('step')}}}else P.moving=0;
P.inv-=dt;
// spawn
const rate=1.2+T/9;nv+=rate*dt;while(nv>=1){nv--;if(E.length<380)spawn()}
// fire
cd-=dt;if(cd<=0&&E.length){
let n=null,nd=1e9;for(const e of E){const d=(e.x-P.x)**2+(e.y-P.y)**2;if(d<nd){nd=d;n=e}}
if(nd<420*420){const a=Math.atan2(n.y-P.y,n.x-P.x);
for(let i=0;i<S.count;i++){const o=(i-(S.count-1)/2)*.18;B.push({x:P.x,y:P.y,vx:Math.cos(a+o)*430,vy:Math.sin(a+o)*430,l:1.1,p:1})}sfx('shoot');
cd=.7/S.rate}else cd=.1}
// bullets
for(const b of B){b.x+=b.vx*dt;b.y+=b.vy*dt;b.l-=dt;
for(const e of E){if(!e.dead&&Math.hypot(e.x-b.x,e.y-b.y)<e.r+4){hurt(e,9*S.dmg/1.5*1.5);b.l=0;break}}}
B=B.filter(b=>b.l>0);
// orbit
S.ang+=dt*3.2;
for(let i=0;i<S.orbit;i++){const a=S.ang+i*6.283/S.orbit,bx=P.x+Math.cos(a)*75,by=P.y+Math.sin(a)*75;if(Math.random()<dt*35)FX.push({x:bx,y:by,vx:R(-30,30),vy:R(-30,30),l:.4,c:'#7ab8ff'});
for(const e of E){if(!e.dead&&e.hit<=0&&Math.hypot(e.x-bx,e.y-by)<e.r+9){hurt(e,6*S.dmg);e.hit=.3}}}
// nova
if(S.nova){S.ncd-=dt;if(S.ncd<=0){S.ncd=3.5/(1+S.nova*.2);const rr=90+S.nova*25;
for(const e of E)if(!e.dead&&Math.hypot(e.x-P.x,e.y-P.y)<rr+e.r)hurt(e,8*S.dmg*(1+S.nova*.3));
FX.push({ring:1,x:P.x,y:P.y,r:0,mr:rr,l:.35,ml:.35})}}
// enemies
for(const e of E){e.hit-=dt;e.fl-=dt;{const ddx=P.x-e.x;if(ddx>6)e.flip=1;else if(ddx<-6)e.flip=-1}const a=Math.atan2(P.y-e.y,P.x-e.x);e.x+=Math.cos(a)*e.s*dt;e.y+=Math.sin(a)*e.s*dt;
if(!e.dead&&P.inv<=0&&Math.hypot(e.x-P.x,e.y-P.y)<e.r+10){P.hp-=e.dmg;P.inv=.45;shake=6;if(P.hp<=0){over();return}}}
E=E.filter(e=>!e.dead&&Math.hypot(e.x-P.x,e.y-P.y)<Math.hypot(W,H));
// separation: spatial grid + mass-weighted push, so zombies touch and slide past without overlapping
{const CS=96,YS=1.3,gr=new Map(),n=E.length;
for(let i=0;i<n;i++){const e=E[i];e.i=i;e.sr=e.r*2.1;const k=Math.floor(e.x/CS)*100003+Math.floor(e.y/CS);const a=gr.get(k);if(a)a.push(e);else gr.set(k,[e])}
for(let it=0;it<3;it++){for(let i=0;i<n;i++){const a=E[i],cx=Math.floor(a.x/CS),cy=Math.floor(a.y/CS);
for(let ox=-1;ox<=1;ox++)for(let oy=-1;oy<=1;oy++){const c=gr.get((cx+ox)*100003+cy+oy);if(!c)continue;
for(const b of c){if(b.i<=a.i)continue;let dx=b.x-a.x,dy=(b.y-a.y)*YS,d=Math.hypot(dx,dy);const m=a.sr+b.sr;
if(d<m){if(d<1e-3){const r=R(0,6.283);dx=Math.cos(r);dy=Math.sin(r);d=1}
const ov=(m-d)*.5,nx=dx/d,ny=dy/d,ma=a.r*a.r,mb=b.r*b.r,wa=mb/(ma+mb);
a.x-=nx*ov*wa;a.y-=ny*ov*wa/YS;b.x+=nx*ov*(1-wa);b.y+=ny*ov*(1-wa)/YS}}}}}
E.sort((a,b)=>a.y-b.y)}
// gems
for(const g of G){const d=Math.hypot(P.x-g.x,P.y-g.y);if(d<S.mag){g.x+=(P.x-g.x)/d*320*dt;g.y+=(P.y-g.y)/d*320*dt}
if(d<14){g.got=1;P.xp+=g.v;sfx('gem')}}
G=G.filter(g=>!g.got);
for(const d of DY){d.t+=dt;d.x+=d.vx*dt;d.y+=d.vy*dt;const k=Math.pow(.03,dt);d.vx*=k;d.vy*=k}DY=DY.filter(d=>d.t<.5);
for(const f of FX){f.l-=dt;if(!f.ring){f.x+=f.vx*dt;f.y+=f.vy*dt}else f.r=f.mr*(1-f.l/f.ml)}
FX=FX.filter(f=>f.l>0);
shake*=.88;
if(P.xp>=P.next)levelUp()}

function draw(){
ctx.fillStyle='#0b0b16';ctx.fillRect(0,0,W,H);
const sx=shake?R(-shake,shake):0,sy=shake?R(-shake,shake):0;
const cx=W/2-P.x+sx,cy=H/2-P.y+sy;
ctx.save();ctx.translate(cx,cy);
// sidewalk
ctx.fillStyle=PAT||'#2a2a30';ctx.fillRect(P.x-W/2-12,P.y-H/2-12,W+24,H+24);
// gold coins (spinning)
for(const q of G){const w=8*Math.max(.22,Math.abs(Math.cos(T*5+q.x*.07)));
ctx.fillStyle='rgba(255,205,60,.16)';ctx.beginPath();ctx.arc(q.x,q.y,12,0,6.283);ctx.fill();
ctx.fillStyle='#a8740a';ctx.beginPath();ctx.ellipse(q.x,q.y,w,8,0,0,6.283);ctx.fill();
ctx.fillStyle='#ffd84a';ctx.beginPath();ctx.ellipse(q.x,q.y,w*.82,6.6,0,0,6.283);ctx.fill();
ctx.fillStyle='#fff4b0';ctx.beginPath();ctx.ellipse(q.x-w*.28,q.y-2.6,w*.3,2.2,0,0,6.283);ctx.fill();
if(w>4.5){ctx.strokeStyle='#d9a000';ctx.lineWidth=1.2;ctx.beginPath();ctx.ellipse(q.x,q.y,w*.5,3.8,0,0,6.283);ctx.stroke()}}
// dying zombies
if(ZS)for(const d of DY){const p=d.t/.5,sc=p<.2?1+.4*(p/.2):1.4*Math.pow(1-(p-.2)/.8,1.2),w=d.r*4.4*sc,h=w*ZH;
shadow(d.x,d.y+d.r*.95,d.r*3.1*(1-p*.6),.85*(1-p));ctx.fillStyle='rgba(120,200,60,'+(.4*(1-p))+')';ctx.beginPath();ctx.ellipse(d.x,d.y+d.r*.9,d.r*(1+p*1.6),d.r*.5*(1+p),0,0,6.283);ctx.fill();
ctx.save();ctx.translate(d.x,d.y-p*d.r*1.2);ctx.rotate(d.rot*p);ctx.scale(d.flip,1);ctx.globalAlpha=Math.max(0,1-p*p);
ctx.drawImage(d.t<.1?ZW[d.k]:ZS[d.k],-w/2,-h*.6,w,h);ctx.restore()}
// enemies
if(ZS){for(const e of E){const w=e.r*4.4,h=w*ZH,t=T*(5+e.s/30)+e.ph,sn=Math.sin(t);
shadow(e.x,e.y+e.r*.95,e.r*3.1*(1-Math.abs(sn)*.12),.85);
ctx.save();ctx.translate(e.x,e.y-Math.abs(sn)*e.r*.4);ctx.rotate(sn*.13);ctx.scale(e.flip*(1+.07*Math.cos(t*2)),1-.07*Math.cos(t*2));
ctx.drawImage(e.fl>0?ZW[e.k]:ZS[e.k],-w/2,-h*.6,w,h);ctx.restore()}}
else{
for(const e of E){ctx.fillStyle=e.fl>0?'#fff':e.c;ctx.beginPath();
if(e.k===0)ctx.arc(e.x,e.y,e.r,0,6.283);
else if(e.k===1){const a=Math.atan2(P.y-e.y,P.x-e.x);ctx.moveTo(e.x+Math.cos(a)*e.r*1.4,e.y+Math.sin(a)*e.r*1.4);ctx.lineTo(e.x+Math.cos(a+2.4)*e.r,e.y+Math.sin(a+2.4)*e.r);ctx.lineTo(e.x+Math.cos(a-2.4)*e.r,e.y+Math.sin(a-2.4)*e.r)}
else ctx.rect(e.x-e.r,e.y-e.r,e.r*2,e.r*2);
ctx.fill()}
}
// bolts
if(BIMG.complete&&BIMG.naturalWidth){const bw=64,bh=bw*BIMG.naturalHeight/BIMG.naturalWidth;
for(const b of B){ctx.save();ctx.translate(b.x,b.y);ctx.rotate(Math.atan2(b.vy,b.vx));ctx.drawImage(BIMG,-bw*.72,-bh/2,bw,bh);ctx.restore()}}
else{ctx.fillStyle='#7cf5ff';for(const b of B){ctx.beginPath();ctx.arc(b.x,b.y,4,0,6.283);ctx.fill()}}
// orbit blades: blue glowing star with comet tail
ctx.save();ctx.globalCompositeOperation='lighter';
for(let i=0;i<S.orbit;i++){const a=S.ang+i*6.283/S.orbit;
for(let k=20;k>=1;k--){const aa=a-k*.05,f=1-k/21,x=P.x+Math.cos(aa)*75,y=P.y+Math.sin(aa)*75;
ctx.fillStyle='rgba(50,130,255,'+(f*f*.5)+')';ctx.beginPath();ctx.arc(x,y,2+f*7.5,0,6.283);ctx.fill()}
const hx=P.x+Math.cos(a)*75,hy=P.y+Math.sin(a)*75;
ctx.fillStyle='rgba(70,150,255,.13)';ctx.beginPath();ctx.arc(hx,hy,15,0,6.283);ctx.fill();
ctx.save();ctx.translate(hx,hy);ctx.rotate(T*9);ctx.fillStyle='#a8dcff';ctx.beginPath();
for(let q=0;q<8;q++){const r=q%2?3.6:11.5,an=q*Math.PI/4;ctx.lineTo(Math.cos(an)*r,Math.sin(an)*r)}
ctx.closePath();ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,3.6,0,6.283);ctx.fill();ctx.restore()}
ctx.restore();
// fx
for(const f of FX){if(f.ring){ctx.strokeStyle=`rgba(124,245,255,${f.l/f.ml})`;ctx.lineWidth=4;ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,6.283);ctx.stroke()}
else{ctx.globalAlpha=f.l*2.5;ctx.fillStyle=f.c;ctx.fillRect(f.x-2,f.y-2,4,4);ctx.globalAlpha=1}}
// player
shadow(P.x+1,P.y+9,30,.9);
if(P.inv<=0||Math.floor(T*20)%2){ctx.save();ctx.translate(P.x,P.y);ctx.rotate(P.face);drawGuy(P.run||0,P.moving);ctx.restore()}
ctx.restore();
{const v=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.32,W/2,H/2,Math.hypot(W,H)*.6);v.addColorStop(0,'rgba(40,36,30,0)');v.addColorStop(1,'rgba(40,36,30,.28)');ctx.fillStyle=v;ctx.fillRect(0,0,W,H)}
if(state==='menu')return;
// hud
ctx.fillStyle='#16163a';ctx.fillRect(0,0,W,10);ctx.fillStyle='#ffd34d';ctx.fillRect(0,0,W*Math.min(1,P.xp/P.next),10);
ctx.fillStyle='#e8e8ff';ctx.font='bold 16px system-ui,sans-serif';ctx.textAlign='center';
const m=Math.floor(T/60),s=Math.floor(T%60);ctx.fillText(`${m}:${String(s).padStart(2,'0')}`,W/2,34);
ctx.textAlign='left';ctx.fillText('LV '+P.lvl,12,34);ctx.textAlign='right';ctx.fillText('Kills '+K,W-12,34);
const bw=Math.min(220,W-40);ctx.fillStyle='#2a1020';ctx.fillRect(W/2-bw/2,H-34,bw,12);ctx.fillStyle='#ff4f7b';ctx.fillRect(W/2-bw/2,H-34,bw*Math.max(0,P.hp/P.max),12);
if(joy){ctx.strokeStyle='rgba(232,232,255,.35)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(joy.x,joy.y,50,0,6.283);ctx.stroke();ctx.fillStyle='rgba(232,232,255,.35)';ctx.beginPath();ctx.arc(joy.x+joy.dx*50,joy.y+joy.dy*50,18,0,6.283);ctx.fill()}}

let last=performance.now();
P={x:0,y:0,hp:1,max:1,xp:0,next:1,lvl:1,inv:0,face:0,spd:0};S={orbit:0,ang:0};E=[];B=[];G=[];FX=[];T=0;K=0;
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;
if(state==='play')update(dt);
draw();
requestAnimationFrame(loop)}
menu();requestAnimationFrame(loop);
</script>
</body>
</html>
